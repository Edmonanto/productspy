# Render blueprint for the ProductSpy Pro backend (Daily Winners).
# The Next.js frontend deploys separately on Vercel — it is not in here.
#
# This file MUST live at the repository root: Render only reads a Blueprint
# from the root, regardless of where a service's rootDir points.
#
# Both services read secrets from the "ProductSpy Env" env group, which must
# exist under that exact name before the first deploy.
#
# The old productspy-ingest and productspy-match cron jobs were removed with
# the marketplace engine — delete them in the Render dashboard too, or they
# keep running (and failing) on their old schedule.

services:
  # ── API ───────────────────────────────────────────────────────────────
  - type: web
    name: productspy-api
    runtime: python
    rootDir: backend
    plan: free
    # An empty buildCommand skips dependency installation entirely.
    buildCommand: pip install -r requirements.txt
    # Pending migrations are applied on startup (app/main.py lifespan).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: CORS_ORIGINS
        value: https://productspy.pro,https://www.productspy.pro
      - fromGroup: ProductSpy Env

  # ── Daily Winners ─────────────────────────────────────────────────────
  # Once a day: Facebook Ad Library + TikTok Creative Center + TikTok videos
  # for every market in WINNERS_MARKETS, then the 5-10 picks per market. Also
  # runs trial housekeeping (reminder emails, downgrading expired trials).
  #
  # Docker, not the python runtime: the scrapers drive headless Chromium,
  # whose system libraries only the Playwright image provides. Chromium needs
  # memory — "standard" (2 GB) rather than "starter" (512 MB).
  #
  # 01:00 UTC = 09:00 in China, 02:00 in Paris, 21:00 (previous day) in New York.
  - type: cron
    name: productspy-winners
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.winners
    dockerContext: .
    plan: standard
    schedule: "0 1 * * *"
    envVars:
      - fromGroup: ProductSpy Env
